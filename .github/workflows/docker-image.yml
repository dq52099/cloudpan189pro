name: docker-image

on:
  push:
    tags:
      - 'v*'  # 当推送 v* 标签时触发，如 v1.0.0
  workflow_dispatch:  # 允许手动触发
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string

env:
  APP_NAME: cloudpan189pro
  MODULE_NAME: github.com/xxcheng123/cloudpan189-share

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
          fetch-depth: 0  # 获取完整的 git 历史，用于生成构建信息

      - name: 🔍 Resolve DockerHub settings
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "repo=${DOCKERHUB_USERNAME}/${{ env.APP_NAME }}" >> "$GITHUB_OUTPUT"
            echo "✅ DockerHub credentials configured"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "repo=${{ env.APP_NAME }}" >> "$GITHUB_OUTPUT"
            echo "::notice::DockerHub secrets are not configured; Docker image publish will be skipped."
          fi

      - name: 🔧 Set up QEMU
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/setup-qemu-action@v3

      - name: 🔧 Set up Docker Buildx
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to DockerHub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 📊 Generate build metadata
        id: meta
        run: |
          # 设置版本
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            APP_VERSION="${{ github.event.inputs.tag }}"
          else
            APP_VERSION="${GITHUB_REF#refs/tags/}"
          fi
          
          # 生成构建信息 - 与 Makefile 保持一致
          VAR_COMMIT="$(git rev-parse HEAD)"
          VAR_BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          VAR_GIT_SUMMARY="$(git describe --tags --dirty --always 2>/dev/null || git rev-parse --short HEAD)"
          VAR_GIT_BRANCH="$(git rev-parse --abbrev-ref HEAD)"

          {
            echo "APP_VERSION=$APP_VERSION"
            echo "VAR_COMMIT=$VAR_COMMIT"
            echo "VAR_BUILD_DATE=$VAR_BUILD_DATE"
            echo "VAR_GIT_SUMMARY=$VAR_GIT_SUMMARY"
            echo "VAR_GIT_BRANCH=$VAR_GIT_BRANCH"
          } >> "$GITHUB_ENV"
          
          # 输出构建信息用于调试
          echo "🔍 Build Information:"
          echo "  Version: $APP_VERSION"
          echo "  Commit: $VAR_COMMIT"
          echo "  Build Date: $VAR_BUILD_DATE"
          echo "  Git Summary: $VAR_GIT_SUMMARY"
          echo "  Git Branch: $VAR_GIT_BRANCH"

      - name: 🏷️ Generate Docker tags
        if: steps.dockerhub.outputs.enabled == 'true'
        id: tags
        run: |
          # 生成 Docker 标签
          DOCKER_REPO="${{ steps.dockerhub.outputs.repo }}"
          APP_VERSION="${{ env.APP_VERSION }}"
          TAGS="${DOCKER_REPO}:${APP_VERSION}"
          
          # 检查是否为 alpha 版本
          if [[ "$APP_VERSION" == *"alpha"* ]]; then
            # Alpha 版本：添加 alpha 标签，不添加 latest
            TAGS="${TAGS},${DOCKER_REPO}:alpha"
            echo "🔖 检测到 Alpha 版本，将发布为 alpha 标签"
          elif [[ "$APP_VERSION" != *"-"* ]]; then
            # 正式版本：添加 latest 标签
            TAGS="${TAGS},${DOCKER_REPO}:latest"
            echo "🔖 检测到正式版本，将发布为 latest 标签"
          else
            # 其他预发布版本：不添加额外标签
            echo "🔖 检测到预发布版本，仅使用版本标签"
          fi
          
          echo "TAGS=${TAGS}" >> "$GITHUB_ENV"
          echo "Generated tags: ${TAGS}"

      - name: 🔨 Build and push
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            MODULE_NAME=${{ env.MODULE_NAME }}
            VAR_COMMIT=${{ env.VAR_COMMIT }}
            VAR_BUILD_DATE=${{ env.VAR_BUILD_DATE }}
            VAR_GIT_SUMMARY=${{ env.VAR_GIT_SUMMARY }}
            VAR_GIT_BRANCH=${{ env.VAR_GIT_BRANCH }}
            VAR_VERSION=${{ env.APP_VERSION }}
          tags: ${{ env.TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🔍 Inspect multi-arch image
        if: steps.dockerhub.outputs.enabled == 'true'
        run: |
          IMAGE_REF="${{ steps.dockerhub.outputs.repo }}:${{ env.APP_VERSION }}"
          echo "🔍 检查多架构镜像信息..."
          docker buildx imagetools inspect "$IMAGE_REF"

      - name: 📋 Docker Image Info
        if: steps.dockerhub.outputs.enabled == 'true'
        run: |
          APP_NAME="${{ env.APP_NAME }}"
          APP_VERSION="${{ env.APP_VERSION }}"
          DOCKER_REPO="${{ steps.dockerhub.outputs.repo }}"

          echo "🎉 Docker 镜像构建完成！"
          echo ""
          echo "📦 镜像标签:"
          echo "  - ${DOCKER_REPO}:${APP_VERSION}"
          if [[ "$APP_VERSION" == *"alpha"* ]]; then
            echo "  - ${DOCKER_REPO}:alpha"
          elif [[ "$APP_VERSION" != *"-"* ]]; then
            echo "  - ${DOCKER_REPO}:latest"
          fi
          echo ""
          echo "🏗️ 支持的架构:"
          echo "  - linux/amd64"
          echo "  - linux/arm64"
          echo ""
          echo "📋 构建信息:"
          echo "  - Commit: ${{ env.VAR_COMMIT }}"
          echo "  - Build Date: ${{ env.VAR_BUILD_DATE }}"
          echo "  - Git Summary: ${{ env.VAR_GIT_SUMMARY }}"
          echo "  - Git Branch: ${{ env.VAR_GIT_BRANCH }}"
          echo ""
          echo "🚀 使用方法:"
          echo ""
          # 根据版本类型显示不同的使用示例
          if [[ "$APP_VERSION" == *"alpha"* ]]; then
            echo "# Alpha 版本运行 (测试用途)"
            echo "docker run -d \\"
            echo "  --name ${APP_NAME}-alpha \\"
            echo "  -p 12395:12395 \\"
            echo "  -v \$(pwd)/data:/app/data \\"
            echo "  --restart unless-stopped \\"
            echo "  ${DOCKER_REPO}:alpha"
            echo ""
            echo "# 指定版本运行"
            echo "docker run -d ${DOCKER_REPO}:${APP_VERSION}"
          else
            echo "# 基本运行"
            echo "docker run -d \\"
            echo "  --name ${APP_NAME} \\"
            echo "  -p 12395:12395 \\"
            echo "  -v \$(pwd)/data:/app/data \\"
            echo "  --restart unless-stopped \\"
            if [[ "$APP_VERSION" != *"-"* ]]; then
              echo "  ${DOCKER_REPO}:latest"
            else
              echo "  ${DOCKER_REPO}:${APP_VERSION}"
            fi
            echo ""
            echo "# 指定架构运行"
            if [[ "$APP_VERSION" != *"-"* ]]; then
              echo "docker run --platform linux/arm64 -d ${DOCKER_REPO}:latest"
            else
              echo "docker run --platform linux/arm64 -d ${DOCKER_REPO}:${APP_VERSION}"
            fi
          fi
          echo ""
          echo "# Docker Compose 示例"
          echo "version: '3.8'"
          echo "services:"
          echo "  cloudpan189pro:"
          echo "    image: ${DOCKER_REPO}:${APP_VERSION}"
          echo "    container_name: ${APP_NAME}"
          echo "    ports:"
          echo "      - \"12395:12395\""
          echo "    volumes:"
          echo "      - ./data:/app/data"
          echo "    restart: unless-stopped"
          echo "    environment:"
          echo "      - TZ=Asia/Shanghai"

      - name: ℹ️ Docker publish skipped
        if: steps.dockerhub.outputs.enabled != 'true'
        run: |
          echo "DockerHub secrets are not configured, so Docker image publish was skipped."
          echo "Required secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN."
